<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
   <title>Realistic Snake Game</title>
   <style>
       * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
           touch-action: none;
           -webkit-tap-highlight-color: transparent;
       }
       
       body {
           background: linear-gradient(135deg, #0d1b0d 0%, #1a2e1a 100%);
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
           min-height: 100vh;
           font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
           overflow: hidden;
       }
       
       #gameContainer {
           position: relative;
           box-shadow: 
               0 0 40px rgba(0, 100, 0, 0.5),
               inset 0 0 100px rgba(0, 0, 0, 0.5);
           border: 4px solid #2d5016;
           border-radius: 20px;
           background: radial-gradient(ellipse at center, #1a3d1a 0%, #0d1f0d 100%);
       }
       
       canvas {
           display: block;
           border-radius: 16px;
       }
       
       #ui {
           color: #7cb342;
           text-align: center;
           margin-bottom: 15px;
           text-shadow: 0 2px 4px rgba(0,0,0,0.5);
       }
       
       #score {
           font-size: 28px;
           font-weight: bold;
           color: #aed581;
       }
       
       #highScore {
           font-size: 14px;
           color: #558b2f;
           margin-top: 5px;
       }
       
       /* Compact D-Pad Layout */
       #controls {
           margin-top: 15px;
           display: grid;
           grid-template-columns: 60px 60px 60px;
           grid-template-rows: 60px 60px;
           gap: 8px;
           background: rgba(0, 0, 0, 0.3);
           padding: 15px;
           border-radius: 20px;
           border: 2px solid #33691e;
       }
       
       .btn {
           background: linear-gradient(145deg, #4a7c23, #2d5016);
           border: 2px solid #7cb342;
           color: #dcedc8;
           font-size: 20px;
           border-radius: 12px;
           cursor: pointer;
           transition: all 0.1s;
           box-shadow: 
               0 4px 0 #1b5e20,
               0 5px 10px rgba(0,0,0,0.3);
           display: flex;
           align-items: center;
           justify-content: center;
           user-select: none;
       }
       
       .btn:active {
           transform: translateY(4px);
           box-shadow: 
               0 0 0 #1b5e20,
               inset 0 2px 5px rgba(0,0,0,0.3);
           background: linear-gradient(145deg, #7cb342, #558b2f);
       }
       
       /* Position buttons in compact cross layout */
       .btn[data-dir="up"] { 
           grid-column: 2; 
           grid-row: 1;
           border-radius: 12px 12px 8px 8px;
       }
       .btn[data-dir="left"] { 
           grid-column: 1; 
           grid-row: 2;
           border-radius: 12px 8px 8px 12px;
       }
       .btn[data-dir="down"] { 
           grid-column: 2; 
           grid-row: 2;
           border-radius: 8px 8px 12px 12px;
       }
       .btn[data-dir="right"] { 
           grid-column: 3; 
           grid-row: 2;
           border-radius: 8px 12px 12px 8px;
       }
       
       #startScreen, #gameOverScreen {
           position: absolute;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background: rgba(13, 27, 13, 0.95);
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
           color: #aed581;
           border-radius: 16px;
           z-index: 10;
           backdrop-filter: blur(5px);
       }
       
       #gameOverScreen {
           display: none;
       }
       
       h1 {
           font-size: 42px;
           margin-bottom: 10px;
           color: #7cb342;
           text-shadow: 0 0 20px rgba(124, 179, 66, 0.5);
           letter-spacing: 3px;
       }
       
       .snake-icon {
           font-size: 60px;
           margin-bottom: 20px;
           filter: drop-shadow(0 0 10px rgba(124, 179, 66, 0.8));
       }
       
       .menu-btn {
           padding: 15px 40px;
           font-size: 18px;
           background: linear-gradient(145deg, #558b2f, #33691e);
           border: none;
           color: #fff;
           cursor: pointer;
           border-radius: 30px;
           margin-top: 20px;
           transition: all 0.3s;
           font-family: inherit;
           font-weight: bold;
           text-transform: uppercase;
           letter-spacing: 2px;
           box-shadow: 0 4px 15px rgba(0,0,0,0.3);
       }
       
       .menu-btn:hover {
           transform: translateY(-2px);
           box-shadow: 0 6px 20px rgba(124, 179, 66, 0.4);
           background: linear-gradient(145deg, #7cb342, #558b2f);
       }
       
       .instructions {
           margin-top: 25px;
           font-size: 13px;
           color: #81c784;
           text-align: center;
           line-height: 1.8;
           opacity: 0.8;
       }
       
       #finalScore {
           font-size: 32px;
           margin: 15px 0;
           color: #fff;
           font-weight: bold;
       }
       
       .score-label {
           font-size: 14px;
           color: #81c784;
           text-transform: uppercase;
           letter-spacing: 2px;
       }
   </style>
</head>
<body>
   <div id="ui">
       <div id="score">0</div>
       <div id="highScore">Best: 0</div>
   </div>
   
   <div id="gameContainer">
       <canvas id="gameCanvas" width="400" height="400"></canvas>
       
       <div id="startScreen">
           <div class="snake-icon">🐍</div>
           <h1>SNAKE</h1>
           <button class="menu-btn" onclick="startGame()">Start Game</button>
           <div class="instructions">
               Guide the snake to eat apples<br>
               Pass through walls to wrap around<br>
               Don't bite yourself!
           </div>
       </div>
       
       <div id="gameOverScreen">
           <div class="snake-icon">💀</div>
           <h1>Game Over</h1>
           <div class="score-label">Final Score</div>
           <div id="finalScore">0</div>
           <button class="menu-btn" onclick="resetGame()">Play Again</button>
       </div>
   </div>
   
   <div id="controls">
       <button class="btn" data-dir="up" onclick="changeDirection('up')">▲</button>
       <button class="btn" data-dir="left" onclick="changeDirection('left')">◀</button>
       <button class="btn" data-dir="down" onclick="changeDirection('down')">▼</button>
       <button class="btn" data-dir="right" onclick="changeDirection('right')">▶</button>
   </div>

   <script>
       const CANVAS_SIZE = 400;
       const GRID_SIZE = 20;
       const CELL_SIZE = CANVAS_SIZE / GRID_SIZE;
       
       let canvas, ctx;
       let snake = [];
       let food = {};
       let direction = 'right';
       let nextDirection = 'right';
       let score = 0;
       let highScore = localStorage.getItem('snakeHighScore') || 0;
       let gameLoop = null;
       let gameSpeed = 120;
       let isGameRunning = false;
       let snakeColor = { h: 100, s: 70, l: 40 };
       
       window.onload = function() {
           canvas = document.getElementById('gameCanvas');
           ctx = canvas.getContext('2d');
           document.getElementById('highScore').textContent = 'Best: ' + highScore;
           
           document.addEventListener('keydown', handleKeyPress);
           
           // Touch controls
           let touchStartX = 0, touchStartY = 0;
           canvas.addEventListener('touchstart', (e) => {
               touchStartX = e.touches[0].clientX;
               touchStartY = e.touches[0].clientY;
           });
           
           canvas.addEventListener('touchend', (e) => {
               if (!isGameRunning) return;
               let dx = e.changedTouches[0].clientX - touchStartX;
               let dy = e.changedTouches[0].clientY - touchStartY;
               
               if (Math.abs(dx) > Math.abs(dy)) {
                   if (dx > 30 && direction !== 'left') nextDirection = 'right';
                   else if (dx < -30 && direction !== 'right') nextDirection = 'left';
               } else {
                   if (dy > 30 && direction !== 'up') nextDirection = 'down';
                   else if (dy < -30 && direction !== 'down') nextDirection = 'up';
               }
           });
       };
       
       function handleKeyPress(e) {
           if (!isGameRunning) return;
           const keyMap = {
               'ArrowUp': 'up', 'ArrowDown': 'down',
               'ArrowLeft': 'left', 'ArrowRight': 'right',
               'w': 'up', 's': 'down', 'a': 'left', 'd': 'right'
           };
           if (keyMap[e.key]) changeDirection(keyMap[e.key]);
       }
       
       function changeDirection(dir) {
           if (!isGameRunning) return;
           const opposites = { 'up': 'down', 'down': 'up', 'left': 'right', 'right': 'left' };
           if (opposites[dir] !== direction) nextDirection = dir;
       }
       
       function initGame() {
           snake = [
               {x: 10, y: 10},
               {x: 9, y: 10},
               {x: 8, y: 10}
           ];
           direction = 'right';
           nextDirection = 'right';
           score = 0;
           gameSpeed = 120;
           updateScore();
           spawnFood();
       }
       
       function spawnFood() {
           do {
               food = {
                   x: Math.floor(Math.random() * GRID_SIZE),
                   y: Math.floor(Math.random() * GRID_SIZE)
               };
           } while (isSnakeAt(food.x, food.y));
       }
       
       function isSnakeAt(x, y) {
           return snake.some(segment => segment.x === x && segment.y === y);
       }
       
       function update() {
           direction = nextDirection;
           const head = {x: snake[0].x, y: snake[0].y};
           
           // Move head
           switch(direction) {
               case 'up': head.y--; break;
               case 'down': head.y++; break;
               case 'left': head.x--; break;
               case 'right': head.x++; break;
           }
           
           // WRAP AROUND: Check walls and teleport to other side
           if (head.x < 0) head.x = GRID_SIZE - 1;
           else if (head.x >= GRID_SIZE) head.x = 0;
           else if (head.y < 0) head.y = GRID_SIZE - 1;
           else if (head.y >= GRID_SIZE) head.y = 0;
           
           // Check self collision (excluding tail which will move)
           for (let i = 0; i < snake.length - 1; i++) {
               if (head.x === snake[i].x && head.y === snake[i].y) {
                   gameOver();
                   return;
               }
           }
           
           snake.unshift(head);
           
           if (head.x === food.x && head.y === food.y) {
               score += 10;
               updateScore();
               spawnFood();
               if (gameSpeed > 60) {
                   gameSpeed -= 3;
                   clearInterval(gameLoop);
                   gameLoop = setInterval(gameStep, gameSpeed);
               }
           } else {
               snake.pop();
           }
       }
       
       function draw() {
           // Clear with gradient background
           const gradient = ctx.createRadialGradient(
               CANVAS_SIZE/2, CANVAS_SIZE/2, 0,
               CANVAS_SIZE/2, CANVAS_SIZE/2, CANVAS_SIZE
           );
           gradient.addColorStop(0, '#1a3d1a');
           gradient.addColorStop(1, '#0d1f0d');
           ctx.fillStyle = gradient;
           ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
           
           // Draw subtle grid
           ctx.strokeStyle = 'rgba(124, 179, 66, 0.05)';
           ctx.lineWidth = 1;
           for (let i = 0; i <= GRID_SIZE; i++) {
               ctx.beginPath();
               ctx.moveTo(i * CELL_SIZE, 0);
               ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
               ctx.stroke();
               ctx.beginPath();
               ctx.moveTo(0, i * CELL_SIZE);
               ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
               ctx.stroke();
           }
           
           // Draw food (apple)
           const fx = food.x * CELL_SIZE + CELL_SIZE/2;
           const fy = food.y * CELL_SIZE + CELL_SIZE/2;
           
           // Apple shadow
           ctx.fillStyle = 'rgba(0,0,0,0.3)';
           ctx.beginPath();
           ctx.ellipse(fx + 2, fy + 4, 6, 4, 0, 0, Math.PI * 2);
           ctx.fill();
           
           // Apple body
           const appleGradient = ctx.createRadialGradient(fx - 3, fy - 3, 0, fx, fy, 10);
           appleGradient.addColorStop(0, '#ff6b6b');
           appleGradient.addColorStop(1, '#c92a2a');
           ctx.fillStyle = appleGradient;
           ctx.beginPath();
           ctx.arc(fx, fy, 8, 0, Math.PI * 2);
           ctx.fill();
           
           // Apple highlight
           ctx.fillStyle = 'rgba(255,255,255,0.3)';
           ctx.beginPath();
           ctx.arc(fx - 3, fy - 3, 3, 0, Math.PI * 2);
           ctx.fill();
           
           // Apple stem
           ctx.strokeStyle = '#5d4037';
           ctx.lineWidth = 2;
           ctx.beginPath();
           ctx.moveTo(fx, fy - 6);
           ctx.quadraticCurveTo(fx + 2, fy - 10, fx + 4, fy - 8);
           ctx.stroke();
           
           // Apple leaf
           ctx.fillStyle = '#4caf50';
           ctx.beginPath();
           ctx.ellipse(fx + 5, fy - 9, 4, 2, Math.PI/4, 0, Math.PI * 2);
           ctx.fill();
           
           // Draw snake segments with realistic body
           snake.forEach((segment, index) => {
               const x = segment.x * CELL_SIZE;
               const y = segment.y * CELL_SIZE;
               const centerX = x + CELL_SIZE/2;
               const centerY = y + CELL_SIZE/2;
               
               if (index === 0) {
                   // HEAD - Draw realistic snake head
                   drawSnakeHead(centerX, centerY, direction);
               } else if (index === snake.length - 1) {
                   // TAIL - Draw tapered tail
                   drawSnakeTail(segment, snake[index-1], index);
               } else {
                   // BODY - Draw curved body segment
                   drawSnakeBody(segment, snake[index-1], snake[index+1], index);
               }
           });
       }
       
       function drawSnakeHead(x, y, dir) {
           ctx.save();
           ctx.translate(x, y);
           
           // Rotate based on direction
           let rotation = 0;
           if (dir === 'down') rotation = Math.PI/2;
           else if (dir === 'left') rotation = Math.PI;
           else if (dir === 'up') rotation = -Math.PI/2;
           ctx.rotate(rotation);
           
           // Head shadow
           ctx.fillStyle = 'rgba(0,0,0,0.2)';
           ctx.beginPath();
           ctx.ellipse(2, 4, 10, 8, 0, 0, Math.PI * 2);
           ctx.fill();
           
           // Head shape (ellipse for realistic look)
           const headGradient = ctx.createRadialGradient(-3, -3, 0, 0, 0, 12);
           headGradient.addColorStop(0, '#8bc34a');
           headGradient.addColorStop(0.7, '#558b2f');
           headGradient.addColorStop(1, '#33691e');
           ctx.fillStyle = headGradient;
           ctx.beginPath();
           ctx.ellipse(0, 0, 11, 9, 0, 0, Math.PI * 2);
           ctx.fill();
           
           // Scales pattern on head
           ctx.strokeStyle = 'rgba(0,0,0,0.1)';
           ctx.lineWidth = 1;
           for (let i = -6; i < 6; i += 3) {
               ctx.beginPath();
               ctx.moveTo(i, -4);
               ctx.lineTo(i, 4);
               ctx.stroke();
           }
           
           // Eyes (white sclera)
           ctx.fillStyle = '#fff';
           ctx.beginPath();
           ctx.ellipse(4, -4, 3.5, 4, 0, 0, Math.PI * 2);
           ctx.fill();
           ctx.beginPath();
           ctx.ellipse(4, 4, 3.5, 4, 0, 0, Math.PI * 2);
           ctx.fill();
           
           // Pupils (black, looking forward)
           ctx.fillStyle = '#000';
           ctx.beginPath();
           ctx.arc(6, -4, 2, 0, Math.PI * 2);
           ctx.fill();
           ctx.beginPath();
           ctx.arc(6, 4, 2, 0, Math.PI * 2);
           ctx.fill();
           
           // Eye shine
           ctx.fillStyle = '#fff';
           ctx.beginPath();
           ctx.arc(7, -5, 1, 0, Math.PI * 2);
           ctx.fill();
           ctx.beginPath();
           ctx.arc(7, 3, 1, 0, Math.PI * 2);
           ctx.fill();
           
           // Nostrils
           ctx.fillStyle = '#1b5e20';
           ctx.beginPath();
           ctx.ellipse(8, -2, 1, 0.5, 0, 0, Math.PI * 2);
           ctx.fill();
           ctx.beginPath();
           ctx.ellipse(8, 2, 1, 0.5, 0, 0, Math.PI * 2);
           ctx.fill();
           
           // Tongue (flicking animation based on time)
           if (Math.floor(Date.now() / 200) % 2 === 0) {
               ctx.strokeStyle = '#e91e63';
               ctx.lineWidth = 2;
               ctx.beginPath();
               ctx.moveTo(10, 0);
               ctx.quadraticCurveTo(16, -2, 20, 0);
               ctx.quadraticCurveTo(16, 2, 10, 0);
               ctx.stroke();
               
               // Forked tip
               ctx.beginPath();
               ctx.moveTo(18, -1);
               ctx.lineTo(22, -3);
               ctx.moveTo(18, 1);
               ctx.lineTo(22, 3);
               ctx.stroke();
           }
           
           ctx.restore();
       }
       
       function drawSnakeBody(current, prev, next, index) {
           const x = current.x * CELL_SIZE + CELL_SIZE/2;
           const y = current.y * CELL_SIZE + CELL_SIZE/2;
           const px = prev.x * CELL_SIZE + CELL_SIZE/2;
           const py = prev.y * CELL_SIZE + CELL_SIZE/2;
           const nx = next.x * CELL_SIZE + CELL_SIZE/2;
           const ny = next.y * CELL_SIZE + CELL_SIZE/2;
           
           // Calculate curve direction
           const dx = (px - x) + (nx - x);
           const dy = (py - y) + (ny - y);
           
           // Color gradient based on position in snake
           const hue = 100 - (index * 2);
           const lightness = 40 + (index * 0.5);
           
           // Body shadow
           ctx.fillStyle = 'rgba(0,0,0,0.15)';
           ctx.beginPath();
           ctx.ellipse(x + 1, y + 2, 9, 7, 0, 0, Math.PI * 2);
           ctx.fill();
           
           // Main body segment
           const bodyGradient = ctx.createRadialGradient(x-2, y-2, 0, x, y, 10);
           bodyGradient.addColorStop(0, `hsl(${hue}, 60%, ${lightness + 10}%)`);
           bodyGradient.addColorStop(1, `hsl(${hue}, 70%, ${lightness}%)`);
           ctx.fillStyle = bodyGradient;
           
           // Draw curved body based on neighbors
           ctx.beginPath();
           ctx.ellipse(x, y, 9, 7, Math.atan2(dy, dx), 0, Math.PI * 2);
           ctx.fill();
           
           // Scale pattern
           ctx.strokeStyle = 'rgba(0,0,0,0.08)';
           ctx.lineWidth = 1;
           ctx.beginPath();
           for (let i = -6; i <= 6; i += 2) {
               ctx.moveTo(x + i - 2, y - 5);
               ctx.lineTo(x + i, y + 5);
           }
           ctx.stroke();
           
           // Belly (lighter underside)
           ctx.fillStyle = 'rgba(255,255,255,0.1)';
           ctx.beginPath();
           ctx.ellipse(x, y + 3, 5, 3, 0, 0, Math.PI * 2);
           ctx.fill();
       }
       
       function drawSnakeTail(current, prev, index) {
           const x = current.x * CELL_SIZE + CELL_SIZE/2;
           const y = current.y * CELL_SIZE + CELL_SIZE/2;
           const px = prev.x * CELL_SIZE + CELL_SIZE/2;
           const py = prev.y * CELL_SIZE + CELL_SIZE/2;
           
           const angle = Math.atan2(py - y, px - x);
           
           // Tail shadow
           ctx.fillStyle = 'rgba(0,0,0,0.15)';
           ctx.beginPath();
           ctx.ellipse(x + 1, y + 2, 6, 4, angle, 0, Math.PI * 2);
           ctx.fill();
           
           // Tail gradient (tapered)
           const tailGradient = ctx.createLinearGradient(
               x - Math.cos(angle) * 8, y - Math.sin(angle) * 8,
               x + Math.cos(angle) * 8, y + Math.sin(angle) * 8
           );
           tailGradient.addColorStop(0, '#33691e');
           tailGradient.addColorStop(0.5, '#558b2f');
           tailGradient.addColorStop(1, '#2e4a1c');
           
           ctx.fillStyle = tailGradient;
           ctx.beginPath();
           ctx.ellipse(x, y, 7, 5, angle, 0, Math.PI * 2);
           ctx.fill();
           
           // Tail tip (pointy)
           ctx.fillStyle = '#2e4a1c';
           ctx.beginPath();
           ctx.ellipse(
               x - Math.cos(angle) * 5,
               y - Math.sin(angle) * 5,
               3, 2, angle, 0, Math.PI * 2
           );
           ctx.fill();
       }
       
       function gameStep() {
           update();
           draw();
       }
       
       function startGame() {
           document.getElementById('startScreen').style.display = 'none';
           initGame();
           isGameRunning = true;
           gameLoop = setInterval(gameStep, gameSpeed);
       }
       
       function gameOver() {
           isGameRunning = false;
           clearInterval(gameLoop);
           
           if (score > highScore) {
               highScore = score;
               localStorage.setItem('snakeHighScore', highScore);
               document.getElementById('highScore').textContent = 'Best: ' + highScore;
           }
           
           document.getElementById('finalScore').textContent = score;
           document.getElementById('gameOverScreen').style.display = 'flex';
       }
       
       function resetGame() {
           document.getElementById('gameOverScreen').style.display = 'none';
           startGame();
       }
       
       function updateScore() {
           document.getElementById('score').textContent = score;
       }
   </script>
</body>
</html>
