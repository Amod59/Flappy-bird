<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
   <meta name="apple-mobile-web-app-capable" content="yes">
   <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
   <meta name="format-detection" content="telephone=no">
   <title>Snake Game</title>
   <style>
       * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
           -webkit-touch-callout: none;
           -webkit-user-select: none;
           -webkit-tap-highlight-color: transparent;
           touch-action: none;
       }
       
       html, body {
           height: 100%;
           width: 100%;
           overflow: hidden;
           position: fixed;
       }
       
       body {
           background: linear-gradient(135deg, #0d1b0d 0%, #1a2e1a 100%);
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: flex-start;
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
           padding-top: env(safe-area-inset-top);
           padding-bottom: env(safe-area-inset-bottom);
           padding-left: env(safe-area-inset-left);
           padding-right: env(safe-area-inset-right);
       }
       
       #ui {
           color: #7cb342;
           text-align: center;
           margin-top: 10px;
           margin-bottom: 10px;
           text-shadow: 0 2px 4px rgba(0,0,0,0.5);
           z-index: 100;
       }
       
       #score {
           font-size: 32px;
           font-weight: 700;
           color: #aed581;
       }
       
       #highScore {
           font-size: 14px;
           color: #558b2f;
           margin-top: 2px;
           font-weight: 500;
       }
       
       #gameContainer {
           position: relative;
           box-shadow: 
               0 0 30px rgba(0, 100, 0, 0.4),
               inset 0 0 60px rgba(0, 0, 0, 0.4);
           border: 3px solid #2d5016;
           border-radius: 16px;
           background: radial-gradient(ellipse at center, #1a3d1a 0%, #0d1f0d 100%);
           margin: 0 10px;
       }
       
       canvas {
           display: block;
           border-radius: 13px;
           touch-action: none;
       }
       
       /* iOS-Optimized Controls - Larger touch targets */
       #controls {
           margin-top: 15px;
           display: grid;
           grid-template-columns: 70px 70px 70px;
           grid-template-rows: 70px 70px;
           gap: 12px;
           background: rgba(0, 0, 0, 0.25);
           padding: 20px;
           border-radius: 24px;
           border: 2px solid #33691e;
           margin-bottom: 20px;
       }
       
       .btn {
           background: linear-gradient(145deg, #558b2f, #33691e);
           border: 2px solid #7cb342;
           color: #dcedc8;
           font-size: 24px;
           border-radius: 16px;
           cursor: pointer;
           transition: transform 0.1s, background 0.1s;
           box-shadow: 
               0 6px 0 #1b5e20,
               0 8px 16px rgba(0,0,0,0.4);
           display: flex;
           align-items: center;
           justify-content: center;
           min-height: 44px; /* iOS HIG minimum */
           min-width: 44px;
           -webkit-appearance: none;
       }
       
       .btn:active {
           transform: translateY(6px) scale(0.95);
           box-shadow: 
               0 0 0 #1b5e20,
               inset 0 3px 8px rgba(0,0,0,0.4);
           background: linear-gradient(145deg, #7cb342, #558b2f);
       }
       
       .btn[data-dir="up"] { 
           grid-column: 2; 
           grid-row: 1;
           border-radius: 16px 16px 12px 12px;
       }
       .btn[data-dir="left"] { 
           grid-column: 1; 
           grid-row: 2;
           border-radius: 16px 12px 12px 16px;
       }
       .btn[data-dir="down"] { 
           grid-column: 2; 
           grid-row: 2;
           border-radius: 12px 12px 16px 16px;
       }
       .btn[data-dir="right"] { 
           grid-column: 3; 
           grid-row: 2;
           border-radius: 12px 16px 16px 12px;
       }
       
       #startScreen, #gameOverScreen {
           position: absolute;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background: rgba(13, 27, 13, 0.95);
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
           color: #aed581;
           border-radius: 13px;
           z-index: 1000;
           backdrop-filter: blur(10px);
           -webkit-backdrop-filter: blur(10px);
       }
       
       #gameOverScreen {
           display: none;
       }
       
       h1 {
           font-size: 36px;
           margin-bottom: 10px;
           color: #7cb342;
           text-shadow: 0 0 20px rgba(124, 179, 66, 0.5);
           letter-spacing: 2px;
           font-weight: 700;
       }
       
       .snake-icon {
           font-size: 70px;
           margin-bottom: 20px;
           filter: drop-shadow(0 0 15px rgba(124, 179, 66, 0.8));
       }
       
       .menu-btn {
           padding: 18px 50px;
           font-size: 20px;
           background: linear-gradient(145deg, #7cb342, #558b2f);
           border: none;
           color: #fff;
           cursor: pointer;
           border-radius: 30px;
           margin-top: 25px;
           transition: all 0.2s;
           font-weight: 600;
           text-transform: uppercase;
           letter-spacing: 1px;
           box-shadow: 0 6px 20px rgba(0,0,0,0.3);
           -webkit-appearance: none;
           min-height: 44px;
       }
       
       .menu-btn:active {
           transform: scale(0.95);
           box-shadow: 0 3px 10px rgba(0,0,0,0.3);
       }
       
       .instructions {
           margin-top: 30px;
           font-size: 15px;
           color: #81c784;
           text-align: center;
           line-height: 1.8;
           opacity: 0.9;
           padding: 0 20px;
           max-width: 280px;
       }
       
       #finalScore {
           font-size: 48px;
           margin: 15px 0;
           color: #fff;
           font-weight: 700;
       }
       
       .score-label {
           font-size: 16px;
           color: #81c784;
           text-transform: uppercase;
           letter-spacing: 2px;
           font-weight: 500;
       }
       
       /* iOS Safe area handling for notched devices */
       @supports (padding-top: env(safe-area-inset-top)) {
           body {
               padding-top: max(10px, env(safe-area-inset-top));
               padding-bottom: max(10px, env(safe-area-inset-bottom));
           }
       }
       
       /* Prevent text selection on iOS */
       .no-select {
           -webkit-user-select: none;
           user-select: none;
       }
       
       /* iOS momentum scrolling prevention */
       .ios-scroll {
           -webkit-overflow-scrolling: auto;
       }
   </style>
</head>
<body class="no-select ios-scroll">
   <div id="ui">
       <div id="score">0</div>
       <div id="highScore">Best: 0</div>
   </div>
   
   <div id="gameContainer">
       <canvas id="gameCanvas" width="350" height="350"></canvas>
       
       <div id="startScreen">
           <div class="snake-icon">🐍</div>
           <h1>SNAKE</h1>
           <button class="menu-btn" onclick="startGame()">Start Game</button>
           <div class="instructions">
               Swipe anywhere to move<br>
               Or use the D-pad below<br>
               Pass through walls!
           </div>
       </div>
       
       <div id="gameOverScreen">
           <div class="snake-icon">💀</div>
           <h1>Game Over</h1>
           <div class="score-label">Final Score</div>
           <div id="finalScore">0</div>
           <button class="menu-btn" onclick="resetGame()">Play Again</button>
       </div>
   </div>
   
   <div id="controls">
       <button class="btn" data-dir="up" ontouchstart="handleTouchStart('up')" onclick="changeDirection('up')">▲</button>
       <button class="btn" data-dir="left" ontouchstart="handleTouchStart('left')" onclick="changeDirection('left')">◀</button>
       <button class="btn" data-dir="down" ontouchstart="handleTouchStart('down')" onclick="changeDirection('down')">▼</button>
       <button class="btn" data-dir="right" ontouchstart="handleTouchStart('right')" onclick="changeDirection('right')">▶</button>
   </div>

   <script>
       // iOS-specific optimizations
       const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
       
       const CANVAS_SIZE = 350; // Slightly smaller for iPhone screens
       const GRID_SIZE = 20;
       const CELL_SIZE = CANVAS_SIZE / GRID_SIZE;
       
       let canvas, ctx;
       let snake = [];
       let food = {};
       let direction = 'right';
       let nextDirection = 'right';
       let score = 0;
       let highScore = localStorage.getItem('snakeHighScore') || 0;
       let gameLoop = null;
       let gameSpeed = 130; // Slightly slower for mobile
       let isGameRunning = false;
       let lastTouchTime = 0;
       
       // Prevent iOS bounce/scroll
       document.addEventListener('touchmove', function(e) {
           if (e.target.closest('#gameContainer') || e.target.closest('#controls')) {
               e.preventDefault();
           }
       }, { passive: false });
       
       // Prevent double-tap zoom on iOS
       let lastTouchEnd = 0;
       document.addEventListener('touchend', function(e) {
           const now = Date.now();
           if (now - lastTouchEnd <= 300) {
               e.preventDefault();
           }
           lastTouchEnd = now;
       }, false);
       
       window.onload = function() {
           canvas = document.getElementById('gameCanvas');
           ctx = canvas.getContext('2d');
           
           // iOS: Handle canvas resolution for Retina displays
           if (IS_IOS && window.devicePixelRatio > 1) {
               const dpr = window.devicePixelRatio;
               canvas.width = CANVAS_SIZE * dpr;
               canvas.height = CANVAS_SIZE * dpr;
               canvas.style.width = CANVAS_SIZE + 'px';
               canvas.style.height = CANVAS_SIZE + 'px';
               ctx.scale(dpr, dpr);
           }
           
           document.getElementById('highScore').textContent = 'Best: ' + highScore;
           
           // iOS-optimized keyboard handling
           document.addEventListener('keydown', handleKeyPress);
           
           // Enhanced touch handling for iOS
           setupTouchControls();
       };
       
       function setupTouchControls() {
           let touchStartX = 0;
           let touchStartY = 0;
           let touchStartTime = 0;
           
           const gameArea = document.getElementById('gameContainer');
           
           gameArea.addEventListener('touchstart', function(e) {
               touchStartX = e.touches[0].clientX;
               touchStartY = e.touches[0].clientY;
               touchStartTime = Date.now();
           }, { passive: true });
           
           gameArea.addEventListener('touchend', function(e) {
               if (!isGameRunning) return;
               
               const touchEndX = e.changedTouches[0].clientX;
               const touchEndY = e.changedTouches[0].clientY;
               const touchDuration = Date.now() - touchStartTime;
               
               // Ignore long presses (likely accidental)
               if (touchDuration > 500) return;
               
               const dx = touchEndX - touchStartX;
               const dy = touchEndY - touchStartY;
               const minSwipe = 30; // Minimum swipe distance
               
               // Prevent rapid direction changes (iOS touch debounce)
               const now = Date.now();
               if (now - lastTouchTime < 50) return;
               lastTouchTime = now;
               
               if (Math.abs(dx) > Math.abs(dy)) {
                   if (Math.abs(dx) > minSwipe) {
                       if (dx > 0 && direction !== 'left') nextDirection = 'right';
                       else if (dx < 0 && direction !== 'right') nextDirection = 'left';
                   }
               } else {
                   if (Math.abs(dy) > minSwipe) {
                       if (dy > 0 && direction !== 'up') nextDirection = 'down';
                       else if (dy < 0 && direction !== 'down') nextDirection = 'up';
                   }
               }
           }, { passive: true });
       }
       
       // iOS button touch feedback
       function handleTouchStart(dir) {
           // Immediate feedback for iOS buttons
           changeDirection(dir);
       }
       
       function handleKeyPress(e) {
           if (!isGameRunning) return;
           
           const keyMap = {
               'ArrowUp': 'up', 'ArrowDown': 'down',
               'ArrowLeft': 'left', 'ArrowRight': 'right',
               'w': 'up', 's': 'down', 'a': 'left', 'd': 'right'
           };
           
           if (keyMap[e.key]) {
               e.preventDefault();
               changeDirection(keyMap[e.key]);
           }
       }
       
       function changeDirection(dir) {
           if (!isGameRunning) return;
           
           const opposites = { 'up': 'down', 'down': 'up', 'left': 'right', 'right': 'left' };
           if (opposites[dir] !== direction) {
               nextDirection = dir;
           }
       }
       
       function initGame() {
           snake = [
               {x: 10, y: 10},
               {x: 9, y: 10},
               {x: 8, y: 10}
           ];
           direction = 'right';
           nextDirection = 'right';
           score = 0;
           gameSpeed = 130;
           updateScore();
           spawnFood();
       }
       
       function spawnFood() {
           let attempts = 0;
           do {
               food = {
                   x: Math.floor(Math.random() * GRID_SIZE),
                   y: Math.floor(Math.random() * GRID_SIZE)
               };
               attempts++;
           } while (isSnakeAt(food.x, food.y) && attempts < 100);
       }
       
       function isSnakeAt(x, y) {
           return snake.some(segment => segment.x === x && segment.y === y);
       }
       
       function update() {
           direction = nextDirection;
           const head = {x: snake[0].x, y: snake[0].y};
           
           switch(direction) {
               case 'up': head.y--; break;
               case 'down': head.y++; break;
               case 'left': head.x--; break;
               case 'right': head.x++; break;
           }
           
           // Wrap around walls
           if (head.x < 0) head.x = GRID_SIZE - 1;
           else if (head.x >= GRID_SIZE) head.x = 0;
           else if (head.y < 0) head.y = GRID_SIZE - 1;
           else if (head.y >= GRID_SIZE) head.y = 0;
           
           // Self collision check
           for (let i = 0; i < snake.length - 1; i++) {
               if (head.x === snake[i].x && head.y === snake[i].y) {
                   gameOver();
                   return;
               }
           }
           
           snake.unshift(head);
           
           if (head.x === food.x && head.y === food.y) {
               score += 10;
               updateScore();
               spawnFood();
               
               // Cap max speed for playability on mobile
               if (gameSpeed > 70) {
                   gameSpeed -= 2;
                   clearInterval(gameLoop);
                   gameLoop = setInterval(gameStep, gameSpeed);
               }
           } else {
               snake.pop();
           }
       }
       
       function draw() {
           // Clear canvas
           const gradient = ctx.createRadialGradient(
               CANVAS_SIZE/2, CANVAS_SIZE/2, 0,
               CANVAS_SIZE/2, CANVAS_SIZE/2, CANVAS_SIZE
           );
           gradient.addColorStop(0, '#1a3d1a');
           gradient.addColorStop(1, '#0d1f0d');
           ctx.fillStyle = gradient;
           ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
           
           // Subtle grid
           ctx.strokeStyle = 'rgba(124, 179, 66, 0.06)';
           ctx.lineWidth = 1;
           for (let i = 0; i <= GRID_SIZE; i++) {
               ctx.beginPath();
               ctx.moveTo(i * CELL_SIZE, 0);
               ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
               ctx.stroke();
               ctx.beginPath();
               ctx.moveTo(0, i * CELL_SIZE);
               ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
               ctx.stroke();
           }
           
           // Draw food (apple)
           const fx = food.x * CELL_SIZE + CELL_SIZE/2;
           const fy = food.y * CELL_SIZE + CELL_SIZE/2;
           
           ctx.fillStyle = 'rgba(0,0,0,0.25)';
           ctx.beginPath();
           ctx.ellipse(fx + 2, fy + 4, 6, 4, 0, 0, Math.PI * 2);
           ctx.fill();
           
           const appleGradient = ctx.createRadialGradient(fx - 3, fy - 3, 0, fx, fy, 10);
           appleGradient.addColorStop(0, '#ff6b6b');
           appleGradient.addColorStop(1, '#c92a2a');
           ctx.fillStyle = appleGradient;
           ctx.beginPath();
           ctx.arc(fx, fy, 7, 0, Math.PI * 2);
           ctx.fill();
           
           ctx.fillStyle = 'rgba(255,255,255,0.4)';
           ctx.beginPath();
           ctx.arc(fx - 2, fy - 2, 2.5, 0, Math.PI * 2);
           ctx.fill();
           
           ctx.strokeStyle = '#5d4037';
           ctx.lineWidth = 2;
           ctx.beginPath();
           ctx.moveTo(fx, fy - 5);
           ctx.quadraticCurveTo(fx + 2, fy - 8, fx + 3, fy - 7);
           ctx.stroke();
           
           ctx.fillStyle = '#4caf50';
           ctx.beginPath();
           ctx.ellipse(fx + 4, fy - 7, 3, 1.5, Math.PI/4, 0, Math.PI * 2);
           ctx.fill();
           
           // Draw snake
           snake.forEach((segment, index) => {
               const x = segment.x * CELL_SIZE;
               const y = segment.y * CELL_SIZE;
               const centerX = x + CELL_SIZE/2;
               const centerY = y + CELL_SIZE/2;
               
               if (index === 0) {
                   drawSnakeHead(centerX, centerY, direction);
               } else if (index === snake.length - 1) {
                   drawSnakeTail(segment, snake[index-1], index);
               } else {
                   drawSnakeBody(segment, snake[index-1], snake[index+1], index);
               }
           });
       }
       
       function drawSnakeHead(x, y, dir) {
           ctx.save();
           ctx.translate(x, y);
           
           let rotation = 0;
           if (dir === 'down') rotation = Math.PI/2;
           else if (dir === 'left') rotation = Math.PI;
           else if (dir === 'up') rotation = -Math.PI/2;
           ctx.rotate(rotation);
           
           ctx.fillStyle = 'rgba(0,0,0,0.2)';
           ctx.beginPath();
           ctx.ellipse(2, 4, 9, 7, 0, 0, Math.PI * 2);
           ctx.fill();
           
           const headGradient = ctx.createRadialGradient(-3, -3, 0, 0, 0, 11);
           headGradient.addColorStop(0, '#8bc34a');
           headGradient.addColorStop(0.7, '#558b2f');
           headGradient.addColorStop(1, '#33691e');
           ctx.fillStyle = headGradient;
           ctx.beginPath();
           ctx.ellipse(0, 0, 10, 8, 0, 0, Math.PI * 2);
           ctx.fill();
           
           ctx.strokeStyle = 'rgba(0,0,0,0.1)';
           ctx.lineWidth = 1;
           for (let i = -5; i < 5; i += 2.5) {
               ctx.beginPath();
               ctx.moveTo(i, -3);
               ctx.lineTo(i, 3);
               ctx.stroke();
           }
           
           ctx.fillStyle = '#fff';
           ctx
